services:
  web:
    build: .
    image: giuliomastromartino/basketball-stats:latest
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - PORT=8080
    volumes:
      - .:/app
      - ./instance:/app/instance
    # Run migrations -> Seed DB (via Flask CLI) -> Start Server
    command: >
      sh -c "flask db upgrade &&
             flask seed &&
             exec gunicorn --config gunicorn_config.py run:app"
    restart: unless-stopped
