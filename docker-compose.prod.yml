version: '3.8'

services:

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── One-shot migrator (runs, then exits) ─────────────────────────────────
  migrator:
    build: .
    restart: no
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      GAMES_DIR: /app/Games
      OUTPUT_DIR: /app/Output
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["sh", "-c", "flask db upgrade && python scripts/promote_admin.py"]
    networks:
      - backend

  # ── App replica 1 ─────────────────────────────────────────────────────────
  web_1:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

  # ── App replica 2 ─────────────────────────────────────────────────────────
  web_2:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

  # ── App replica 3 ─────────────────────────────────────────────────────────
  web_3:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

  # ── Nginx load balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web_1
      - web_2
      - web_3
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/basketball.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  # ── Cloudflare Tunnel ─────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy

volumes:
  postgres_data:
  games_data:
  output_data:
  uploads_data:

networks:
  backend:
    driver: bridge
  proxy:
    driver: bridge
