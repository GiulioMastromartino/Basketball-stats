services:

   # ── Database ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

   # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - backend

   # ── One-shot migrator (runs, then exits) ───────────────────────────
  migrator:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      LOG_FILE: /dev/stdout
      GAMES_DIR: /app/Games
      OUTPUT_DIR: /app/Output
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["python", "scripts/migrate.py"]
    networks:
      - backend

   # ── App replica 1 ─────────────────────────────────────────────────────────
  web_1:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      LOG_FILE: /dev/stdout
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

   # ── App replica 2 ─────────────────────────────────────────────────────────
  web_2:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      LOG_FILE: /dev/stdout
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

   # ── App replica 3 ─────────────────────────────────────────────────────────
  web_3:
    build: .
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      LOG_FILE: /dev/stdout
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
    volumes:
      - games_data:/app/Games
      - output_data:/app/Output
      - uploads_data:/app/uploads
    command: ["gunicorn", "-c", "gunicorn_config.py", "run:app"]
    networks:
      - backend

   # ── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: basketball_stats_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # Internal only — Grafana accesses via Docker network at prometheus:9090
    networks:
      - backend

   # ── Loki ────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: basketball_stats_loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

   # ── Promtail ────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: basketball_stats_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - backend

   # ── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: basketball_stats_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/basketball-stats.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - backend

   # ── Nginx load balancer ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web_1
      - web_2
      - web_3
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/basketball.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

volumes:
  postgres_data:
  games_data:
  output_data:
  uploads_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
