services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: basketball_jenkins
    restart: unless-stopped
    network_mode: host
    volumes:
      # Jenkins home — bind mount so the Docker daemon can see workspace files
      - /var/jenkins_home:/var/jenkins_home
      # Docker socket — allows Jenkins to control the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount real .env.prod for deploy (place at /var/jenkins_home/.env.prod)
      - /var/jenkins_home/.env.prod:/app/.env.prod:ro
    group_add:
      - "110"
    environment:
      - TZ=Europe/Rome
      - JENKINS_OPTS=--httpPort=8081
    # Allow Jenkins to use a lot of memory for builds
    deploy:
      resources:
        limits:
          memory: 2g
