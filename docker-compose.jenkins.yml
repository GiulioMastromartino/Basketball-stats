services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: basketball_jenkins
    restart: unless-stopped
    network_mode: host
    volumes:
      # Jenkins home — bind mount so the Docker daemon can see workspace files
      - /var/jenkins_home:/var/jenkins_home
      # Docker socket — allows Jenkins to control the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the real .env.prod so deploy.sh has access to production secrets
      - /app/basketball-stats/.env.prod:/app/.env.prod:ro
    group_add:
      # Docker socket GID — adjust to match host: getent group docker | cut -d: -f3
      - "999"
    environment:
      - TZ=Europe/Rome
      - JENKINS_OPTS=--httpPort=8081
    # Allow Jenkins to use a lot of memory for builds
    deploy:
      resources:
        limits:
          memory: 2g
