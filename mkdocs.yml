site_name: HoopsLab
site_description: Professional Basketball Statistics Tracking & Analytics Platform — Track the full game live. Print the halftime report in seconds.
site_author: Giulio Mastromartino
repo_url: https://github.com/GiulioMastromartino/Basketball-stats
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Giulio Mastromartino

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  logo: assets/basketball_icon.svg
  favicon: assets/basketball_icon.svg

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GiulioMastromartino/Basketball-stats
    - icon: fontawesome/solid/envelope
      link: mailto:giulio@example.com

nav:
  - Home: index.md
  - Quick Start: user-guide/getting-started.md
  - User Guide:
    - 'Live Game Tracking': user-guide/live-game.md
    - 'Plays Management': user-guide/plays.md
    - 'Analytics & Reports': user-guide/advanced-analytics.md
    - 'PDF Exports': user-guide/pdf-exports.md
  - Technical:
    - 'Deployment': technical/deployment.md
    - 'Architecture': technical/architecture.md
    - 'API Reference': technical/api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
