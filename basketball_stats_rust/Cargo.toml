[package]
name = "basketball_stats"
version = "0.1.0"
edition = "2021"

[lib]
name = "basketball_stats"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
log = "0.4"
itertools = "0.13"
rand = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
