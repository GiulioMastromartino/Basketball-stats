[package]
name = "basketball_stats"
version = "0.1.0"
edition = "2021"

[lib]
name = "basketball_stats"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
itertools = "0.13"
rustc-hash = "2.0"
md5 = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: local macOS (Xcode 26 + rust 1.96) hits "mis-aligned LINKEDIT" on
# release .so; use debug `maturin build` locally, release on CI/Linux.