worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Upstream: 3 gunicorn replicas ──────────────────────────────────────
    # 127.0.0.11 is Docker's embedded DNS. Without an explicit resolver nginx
    # resolves the replica names ONCE at startup and caches them forever, so a
    # deploy that recreates web-1/2/3 (new container IPs) left nginx proxying
    # to dead addresses: intermittent "connect() failed (111)" 404s on every
    # ~3rd request, including all CSS/JS, which read as "CSS not loading".
    # `zone` + `resolve` make nginx re-resolve via Docker DNS and drop dead
    # peers automatically. Requires nginx >= 1.27.3.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream flask_app {
        zone flask_app 64k;
        least_conn;
        server web-1:8080 resolve;
        server web-2:8080 resolve;
        server web-3:8080 resolve;
        keepalive 32;
    }

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Tuning ─────────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 50M;   # allow large JSON/PDF uploads
    gzip                on;
    gzip_types          text/plain text/css application/json application/javascript;

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
