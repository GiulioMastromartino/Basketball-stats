server {
    listen 80;
    server_name _;

    set_real_ip_from  172.16.0.0/12;   # Docker internal range
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tailscale Funnel terminates TLS externally; nginx only ever receives
        # plain HTTP internally. Force https so Flask url_for() generates
        # correct absolute URLs and CSRF Referer checks pass.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Static files.
    # NOTE: Flask already sends ETag + Cache-Control for these, and app
    # CSS/JS URLs carry a ?v=<mtime> version (see static_url() in
    # web/__init__.py), so browsers re-fetch them automatically on deploy.
    # Do NOT add another Cache-Control here: duplicate Cache-Control
    # headers made browsers cache stale CSS for a day (needed hard refresh).
    # (proxy_cache_valid without a proxy_cache zone is a no-op, removed.)
    location /static/ {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Health endpoint
    location /health {
        proxy_pass http://flask_app/health;
    }
}
