server {
    listen 80;
    server_name _;

    set_real_ip_from  172.16.0.0/12;   # Docker internal range
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tailscale Funnel terminates TLS externally; nginx only ever receives
        # plain HTTP internally. Force https so Flask url_for() generates
        # correct absolute URLs and CSRF Referer checks pass.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Static files.
    location /static/ {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Health endpoint
    location /health {
        proxy_pass http://flask_app/health;
    }
}

# ── HTTPS server block (port 443) ──
# Terminates TLS with Let's Encrypt certificates for www.superhooper.work.gd.
# Proxies to the same flask_app upstream over plain HTTP internally.
server {
    listen 443 ssl;
    server_name www.superhooper.work.gd superhooper.work.gd;

    ssl_certificate     /etc/letsencrypt/live/www.superhooper.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.superhooper.work.gd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    set_real_ip_from  172.16.0.0/12;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Static files.
    location /static/ {
        proxy_pass         http://flask_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  30s;
        proxy_read_timeout     120s;
        proxy_send_timeout     30s;
    }

    # Health endpoint
    location /health {
        proxy_pass http://flask_app/health;
    }
}

