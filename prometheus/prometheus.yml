global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "basketball-stats"
    static_configs:
      - targets:
          - "web_1:8080"
          - "web_2:8080"
          - "web_3:8080"
    metrics_path: "/metrics"
    scheme: http
    relabel_configs:
      - source_labels: ["__address__"]
        regex: "([^:]+):.*"
        target_label: "instance"
        replacement: "${1}"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
