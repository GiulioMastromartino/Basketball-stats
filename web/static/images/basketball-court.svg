<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Court outline -->
  <line x1="20" y1="20" x2="780" y2="20" stroke="#000" stroke-width="2"/>
  <line x1="20" y1="480" x2="780" y2="480" stroke="#000" stroke-width="2"/>
  <line x1="20" y1="20" x2="20" y2="480" stroke="#000" stroke-width="2"/>
  
  <!-- Paint/Key area -->
  <rect x="20" y="170" width="190" height="160" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Free throw circle -->
  <circle cx="210" cy="250" r="60" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Backboard -->
  <line x1="50" y1="220" x2="50" y2="280" stroke="#000" stroke-width="2"/>
  
  <!-- Hoop -->
  <circle cx="60" cy="250" r="8" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- 3-point line -->
  <path d="M 20 60 L 160 60 Q 380 250 160 440 L 20 440" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Mid court line -->
  <line x1="750" y1="20" x2="750" y2="480" stroke="#000" stroke-width="2"/>
  
  <!-- Mid court circle (half) -->
  <path d="M 750 190 A 60 60 0 0 0 750 310" fill="none" stroke="#000" stroke-width="2"/>
</svg>