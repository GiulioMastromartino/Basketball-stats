<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <title>{% block title %}HoopsStats{% endblock %}</title>
    <link href="{{ static_url('vendor/bootstrap-5.3.2/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ static_url('vendor/fonts/fonts.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_url('vendor/fontawesome-6.5.1/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
    <link rel="icon" href="{{ static_url('images/basketball_icon.svg') }}" type="image/svg+xml">

    <style>
        body.play-builder-body {
            font-family: var(--hs-font-body);
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--hs-bg-main);
            color: #fff8eb;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .play-builder-nav {
            background: linear-gradient(165deg, #151a22 0%, #0d1015 100%);
            border-bottom: 1px solid var(--hs-line);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            z-index: 1000;
            flex-shrink: 0;
        }
        .play-builder-nav .navbar-brand {
            font-family: var(--hs-font-display);
            font-size: 1.5rem;
            letter-spacing: 0.06em;
            color: #fff8eb !important;
        }
        #app-content {
            flex: 1 1 auto;
            min-height: 0;
            height: auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="play-builder-body">
    <nav class="navbar navbar-dark play-builder-nav navbar-expand-lg">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <i class="fas fa-basketball-ball me-2" style="color: var(--hs-accent);"></i> HoopsLab
            </a>
            <div class="ms-auto">
                <a class="btn btn-sm btn-outline-light" href="{{ url_for('plays.list_plays') }}">
                    <i class="fas fa-arrow-left me-1"></i> Back to Plays
                </a>
            </div>
        </div>
    </nav>

    <div id="app-content">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ static_url('vendor/jquery-3.6.0/jquery.min.js') }}"></script>
    <script src="{{ static_url('vendor/bootstrap-5.3.2/bootstrap.bundle.min.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
