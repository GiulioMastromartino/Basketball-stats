{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white text-center py-4">
                <h2 class="mb-0">🏀 Basketball Stats</h2>
            </div>
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Sign In</h4>
                
                <!-- WorkOS AuthKit Sign In Button -->
                <div class="d-grid gap-3 mb-4">
                    <a href="{{ auth_url }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign in with WorkOS
                    </a>
                </div>
                
                <hr class="my-4">
                
                <!-- Magic Link Option -->
                <h6 class="text-center text-muted mb-3">Or sign in with Magic Link</h6>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="Enter your email" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="fas fa-magic me-2"></i>Send Magic Link
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted text-center py-3">
                <small>Restricted Access - Authorized Personnel Only</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
