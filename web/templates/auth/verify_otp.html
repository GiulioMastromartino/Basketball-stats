{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white text-center py-4">
                <h2 class="mb-0">Verify OTP</h2>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center">Enter the 6-digit code sent to your email.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="otp_code" class="form-label">Verification Code</label>
                        <input type="text" class="form-control" id="otp_code" name="otp_code" maxlength="6" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Verify</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
